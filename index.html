<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Sounder — Fish Finder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Sounder">
<meta name="theme-color" content="#1a1d1c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0e0a;
    font-family: 'Baloo 2', sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  #device {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #2b2f2e 0%, #1a1d1c 100%);
    padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 12px);
  }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px 6px;
    color: #d8d4c8;
  }
  #brand { font-family: 'VT323', monospace; font-size: 22px; letter-spacing: 2px; color: #ffb347; display: flex; align-items: center; gap: 8px;}
  #pingDot { width: 9px; height: 9px; border-radius: 50%; background: #39ff88; opacity: 0.3; }
  #hud {
    display: flex; gap: 14px; font-family: 'VT323', monospace; font-size: 19px; color: #9fe1cb;
  }
  #hud span b { color: #ffb347; }
  #screenWrap {
    flex: 1; min-height: 0; margin: 4px 10px; border-radius: 14px;
    background: #000;
    border: 6px solid #14312a;
    box-shadow: inset 0 0 22px rgba(0,0,0,0.85), 0 4px 10px rgba(0,0,0,0.5);
    position: relative; overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #scanline-overlay {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 2px, transparent 3px);
    mix-blend-mode: multiply;
  }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 60px 18px rgba(0,0,0,0.6);
  }
  #controls {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 12px 10px 4px;
  }
  button {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 17px;
    border: none; border-radius: 999px; padding: 12px 22px;
    background: linear-gradient(180deg, #3d4a46, #2a3532);
    color: #cfe9df; box-shadow: 0 4px 0 #14201c, 0 6px 10px rgba(0,0,0,0.4);
    cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #14201c; }
</style>
</head>
<body>
<div id="device">
  <div id="topbar">
    <div id="brand"><span id="pingDot"></span>THE SOUNDER</div>
    <div id="hud">
      <span>DEPTH <b id="hudDepth">0</b>ft</span>
      <span>TEMP <b id="hudTemp">68</b>&deg;F</span>
      <span>RANGE <b id="hudRange">60</b>ft</span>
    </div>
  </div>

  <div id="screenWrap">
    <canvas id="c"></canvas>
    <div id="scanline-overlay"></div>
    <div id="vignette"></div>
  </div>

  <div id="controls">
    <button id="soundBtn">Sound: Off</button>
    <button id="paletteBtn">Palette: Thermal</button>
    <button id="rangeBtn">Range: 60 ft</button>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('screenWrap');
  var hudDepth = document.getElementById('hudDepth');
  var hudTemp = document.getElementById('hudTemp');
  var hudRange = document.getElementById('hudRange');
  var pingDot = document.getElementById('pingDot');
  var paletteBtn = document.getElementById('paletteBtn');
  var rangeBtn = document.getElementById('rangeBtn');
  var soundBtn = document.getElementById('soundBtn');

  var W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1);
  var scaleW = 42;
  var plotW = 0, plotH = 0;

  var historyCanvas = document.createElement('canvas');
  var historyCtx = historyCanvas.getContext('2d');
  var tempCanvas = document.createElement('canvas');
  var tempCtx = tempCanvas.getContext('2d');

  function resize(){
    var r = wrap.getBoundingClientRect();
    W = Math.floor(r.width); H = Math.floor(r.height);
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    plotW = Math.max(50, W - scaleW);
    plotH = H;
    historyCanvas.width = plotW * DPR; historyCanvas.height = plotH * DPR;
    historyCtx.setTransform(DPR,0,0,DPR,0,0);
    tempCanvas.width = plotW * DPR; tempCanvas.height = plotH * DPR;
    tempCtx.setTransform(DPR,0,0,DPR,0,0);
    historyCtx.fillStyle = '#01100c';
    historyCtx.fillRect(0,0,plotW,plotH);
  }
  window.addEventListener('resize', resize);

  var ranges = [20, 40, 60, 100];
  var rangeIdx = 2;
  function maxDepth(){ return ranges[rangeIdx]; }
  rangeBtn.addEventListener('click', function(){
    rangeIdx = (rangeIdx + 1) % ranges.length;
    rangeBtn.textContent = 'Range: ' + ranges[rangeIdx] + ' ft';
    hudRange.textContent = ranges[rangeIdx];
  });

  // ============================================================
  //  PALETTES — each defines the sonar intensity ramp AND the
  //  color set used to tint the fish sprite SVGs.
  //  D=dark back, M=mid, L=light, BL=belly, F=fin, A=accent, R=ray/line
  // ============================================================
  var PALETTES = {
    Thermal: {
      ramp: [[4,10,30],[10,60,140],[40,170,90],[240,210,40],[235,60,30]],
      stops: [0.35,0.6,0.82],
      D:'#8f2a0e', M:'#d9601a', L:'#f5a623', BL:'#ffd968', F:'#a13a10', A:'#ffe9a0', R:'#7a2c12'
    },
    Green: {
      ramp: [[2,14,8],[15,110,55],[80,230,110],[210,255,190],[255,255,230]],
      stops: [0.4,0.7,0.9],
      D:'#0a3a1c', M:'#1f8a4a', L:'#52d67e', BL:'#b8ffd0', F:'#0f5c2e', A:'#d8ffe0', R:'#06421e'
    },
    Blue: {
      ramp: [[2,4,20],[20,60,140],[90,180,255],[210,235,255],[255,255,255]],
      stops: [0.4,0.7,0.9],
      D:'#0a1c4a', M:'#1f4a9a', L:'#52a0e6', BL:'#b8e0ff', F:'#123a7a', A:'#e0f2ff', R:'#0a2a5a'
    }
  };
  var paletteNames = ['Thermal','Green','Blue'];
  var paletteIdx = 0;
  function pal(){ return PALETTES[paletteNames[paletteIdx]]; }

  paletteBtn.addEventListener('click', function(){
    paletteIdx = (paletteIdx + 1) % paletteNames.length;
    paletteBtn.textContent = 'Palette: ' + paletteNames[paletteIdx];
    buildSprites();
  });

  function colorFor(intensity){
    intensity = Math.max(0, Math.min(1, intensity));
    var p = pal(), ramp = p.ramp, stops = p.stops;
    var seg = 0;
    var lo = 0, hi = 1;
    if (intensity < stops[0]){ seg = 0; lo = 0; hi = stops[0]; }
    else if (intensity < stops[1]){ seg = 1; lo = stops[0]; hi = stops[1]; }
    else if (intensity < stops[2]){ seg = 2; lo = stops[1]; hi = stops[2]; }
    else { seg = 3; lo = stops[2]; hi = 1; }
    var t = (intensity - lo) / (hi - lo || 1);
    var a = ramp[seg], b = ramp[seg+1];
    return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
  }

  function depthToY(d){ return (d / maxDepth()) * plotH; }
  function rand(a,b){ return a + Math.random()*(b-a); }

  //  FISH SPRITES — high-detail SVG templates, tinted per palette
  //  and rasterized to Image objects the canvas can stamp.
  //  All face RIGHT. {D}{M}{L}{BL}{F}{A}{R} are color tokens.
  // ============================================================

  function svgWrap(vb, inner){
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'">'
      +'<defs>'
      +'<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="{D}"/><stop offset="0.38" stop-color="{M}"/>'
      +'<stop offset="0.68" stop-color="{L}"/><stop offset="1" stop-color="{BL}"/>'
      +'</linearGradient>'
      +'<linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="{F}"/><stop offset="1" stop-color="{M}" stop-opacity="0.85"/>'
      +'</linearGradient>'
      +'<radialGradient id="ch" cx="50%" cy="50%" r="50%">'
      +'<stop offset="0" stop-color="{A}" stop-opacity="0.5"/><stop offset="1" stop-color="{A}" stop-opacity="0"/>'
      +'</radialGradient>'
      +'<style>.ray{stroke:{R};stroke-width:0.8;opacity:0.45;fill:none}'
      +'.sp{stroke:{R};stroke-width:1;opacity:0.5;fill:none}'
      +'.mo{stroke:{R};stroke-width:1.7;fill:none;stroke-linecap:round}'
      +'</style>'
      +'</defs>' + inner + '</svg>';
  }

  function eye(cx,cy,r){
    return '<circle fill="{R}" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>'
      +'<circle fill="{BL}" cx="'+cx+'" cy="'+cy+'" r="'+(r*0.7)+'"/>'
      +'<circle fill="{D}" cx="'+(cx+r*0.15)+'" cy="'+cy+'" r="'+(r*0.42)+'"/>'
      +'<circle fill="#ffffff" opacity="0.8" cx="'+(cx-r*0.3)+'" cy="'+(cy-r*0.35)+'" r="'+(r*0.18)+'"/>';
  }

    +'<path class="mo" d="M96 -2 Q80 6 62 8"/>'

    + eye(74,-14,6.5) },

    +'<g stroke="{F}" stroke-width="0.9" opacity="0.35" fill="none"><line x1="60" y1="-6" x2="58" y2="6"/><line x1="40" y1="-8" x2="38" y2="8"/><line x1="20" y1="-9" x2="18" y2="9"/><line x1="0" y1="-10" x2="-2" y2="10"/><line x1="-20" y1="-10" x2="-22" y2="10"/><line x1="-40" y1="-9" x2="-42" y2="9"/></g>'
    +'<path fill="url(#fg)" d="M-98 0 Q-110 -13 -124 -18 Q-118 -8 -117 0 Q-118 8 -124 18 Q-110 13 -98 0 Z"/>'
    +'<path class="ray" d="M-104 -4 L-118 -12"/><path class="ray" d="M-104 4 L-118 12"/>'
    +'<path fill="url(#ch)" d="M72 -10 A24 18 0 0 0 72 12 A20 18 0 0 1 62 1 A20 18 0 0 1 72 -10 Z"/>'
    +'<g fill="{R}" opacity="0.6"><circle cx="76" cy="-8" r="2.2"/><circle cx="76" cy="8" r="2.2"/></g>'
    +'<path class="mo" d="M104 2 Q88 6 72 7"/>'
    + eye(88,-4,4.8) },

  leopardseal: { vb:'-140 -60 300 120', len:300, svg:
    '<g transform="translate(-60,0) scale(-1,1)"><path fill="url(#fg)" d="M-42 -18 Q-36 -32 -22 -34 Q-14 -34 -10 -29 Q-20 -24 -28 -20 Q-36 -17 -42 -18 Z"/>'
    +'<path class="ray" d="M-36 -20 L-30 -30"/><path class="ray" d="M-24 -23 L-18 -31"/></g>'
    +'<path fill="url(#fg)" d="M-44 16 Q-50 28 -62 30 Q-54 22 -52 14 Q-46 14 -44 16 Z"/>'
    +'<path fill="url(#fg)" d="M8 16 Q2 28 -10 32 Q-6 22 -4 14 Q2 14 8 16 Z"/>'
    +'<path fill="url(#bg)" d="M112 0 Q100 -10 82 -16 Q50 -26 0 -24 Q-50 -22 -80 -12 Q-100 -6 -106 0 Q-100 6 -80 12 Q-50 22 0 24 Q50 26 82 16 Q100 10 112 2 Q106 1 112 0 Z"/>'
    +'<path fill="#ffffff" opacity="0.12" d="M98 -8 Q40 -18 -30 -16 Q-80 -12 -102 -2 Q-54 -12 14 -14 Q68 -14 98 -8 Z"/>'
    +'<g fill="{R}" opacity="0.55"><circle cx="70" cy="-8" r="2.4"/><circle cx="50" cy="6" r="2.2"/><circle cx="28" cy="-10" r="2.3"/><circle cx="4" cy="8" r="2.1"/><circle cx="-20" cy="-9" r="2.2"/><circle cx="-44" cy="5" r="2.1"/><circle cx="36" cy="14" r="2"/></g>'
    +'<path fill="url(#fg)" d="M-104 0 Q-116 -14 -130 -20 Q-124 -8 -122 0 Q-124 8 -130 20 Q-116 14 -104 0 Z"/>'
    +'<path class="ray" d="M-110 -4 L-124 -12"/><path class="ray" d="M-110 4 L-124 12"/>'
    +'<path fill="url(#ch)" d="M74 -12 A26 20 0 0 0 74 14 A22 20 0 0 1 63 1 A22 20 0 0 1 74 -12 Z"/>'
    +'<path class="sp" d="M72 -13 Q62 1 72 15" opacity="0.4"/>'
    +'<path class="mo" d="M108 2 Q90 8 70 9"/>'
    + eye(90,-6,5) }
  };

  // rasterized sprite cache for the current palette
  var spriteImgs = {};
  function buildSprites(){
    var p = pal();
    Object.keys(SPRITES).forEach(function(key){
      var def = SPRITES[key];
      var svg = svgWrap(def.vb, def.svg)
        .replace(/\{D\}/g, p.D).replace(/\{M\}/g, p.M).replace(/\{L\}/g, p.L)
        .replace(/\{BL\}/g, p.BL).replace(/\{F\}/g, p.F).replace(/\{A\}/g, p.A)
        .replace(/\{R\}/g, p.R);
      var img = new Image();
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      var vbParts = def.vb.split(' ');
      spriteImgs[key] = { img: img, vbW: parseFloat(vbParts[2]), vbH: parseFloat(vbParts[3]) };
    });
  }

  // ============================================================
  //  SONAR AUDIO v2 — richer ping, cleaner blips, ambience bed
  // ============================================================
  var actx = null, masterGain = null, reverbSend = null, soundOn = false;
  var ambNodes = null, bubbleTimer = null;

  function makeReverbImpulse(ac, seconds, decay){
    var rate = ac.sampleRate, len = rate*seconds;
    var buf = ac.createBuffer(2, len, rate);
    for (var ch=0; ch<2; ch++){
      var data = buf.getChannelData(ch);
      for (var i=0;i<len;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
      }
    }
    return buf;
  }
  function makeNoiseBuffer(ac, seconds){
    var rate = ac.sampleRate, len = Math.floor(rate*seconds);
    var buf = ac.createBuffer(1, len, rate);
    var data = buf.getChannelData(0);
    for (var i=0;i<len;i++) data[i] = Math.random()*2-1;
    return buf;
  }

  function ensureAudio(){
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.9;
      masterGain.connect(actx.destination);

      // longer, darker underwater reverb
      var conv = actx.createConvolver();
      conv.buffer = makeReverbImpulse(actx, 2.2, 2.4);
      var convLP = actx.createBiquadFilter();
      convLP.type = 'lowpass'; convLP.frequency.value = 2400;
      var convGain = actx.createGain();
      convGain.gain.value = 0.4;
      conv.connect(convLP); convLP.connect(convGain); convGain.connect(actx.destination);
      reverbSend = conv;
    } catch(e){ actx = null; }
  }

  function startAmbience(){
    if (!actx || ambNodes) return;
    // low filtered noise rumble with a slow swell
    var src = actx.createBufferSource();
    src.buffer = makeNoiseBuffer(actx, 4);
    src.loop = true;
    var lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 200; lp.Q.value = 0.5;
    var g = actx.createGain();
    g.gain.value = 0.028;
    var lfo = actx.createOscillator();
    lfo.frequency.value = 0.07;
    var lfoGain = actx.createGain();
    lfoGain.gain.value = 0.012;
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start(); lfo.start();
    ambNodes = {src:src, lfo:lfo, g:g};
    scheduleBubble();
  }
  function stopAmbience(){
    if (!ambNodes) return;
    try { ambNodes.src.stop(); ambNodes.lfo.stop(); } catch(e){}
    ambNodes = null;
    if (bubbleTimer){ clearTimeout(bubbleTimer); bubbleTimer = null; }
  }
  function scheduleBubble(){
    if (!soundOn) return;
    bubbleTimer = setTimeout(function(){
      bubble();
      scheduleBubble();
    }, rand(2500, 8000));
  }
  function bubble(){
    if (!actx || !soundOn) return;
    var now = actx.currentTime;
    var n = 1 + (Math.random()<0.5 ? 1 : 0) + (Math.random()<0.25 ? 1 : 0);
    for (var i=0;i<n;i++){
      var o = actx.createOscillator();
      var g = actx.createGain();
      var f0 = rand(500, 900);
      var t0 = now + i*rand(0.09,0.16);
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(f0*rand(1.5,2.1), t0 + 0.09);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.02, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
      o.connect(g); g.connect(masterGain); g.connect(reverbSend);
      o.start(t0); o.stop(t0 + 0.14);
    }
  }

  function sonarPing(){
    if (!actx || !soundOn) return;
    var now = actx.currentTime;
    // submarine ping: bright high tone that rings out slowly...
    function ringTone(t0, vol, lpFreq){
      var o = actx.createOscillator();
      var g = actx.createGain();
      var lp = actx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = lpFreq;
      o.type = 'sine';
      o.frequency.setValueAtTime(1250, t0);
      o.frequency.exponentialRampToValueAtTime(1180, t0 + 1.1);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
      // faint second partial gives it that metallic hull ring
      var o2 = actx.createOscillator();
      var g2 = actx.createGain();
      o2.type = 'sine';
      o2.frequency.setValueAtTime(1250*1.34, t0);
      g2.gain.setValueAtTime(0.0001, t0);
      g2.gain.exponentialRampToValueAtTime(vol*0.22, t0 + 0.006);
      g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
      o.connect(g); g.connect(lp);
      o2.connect(g2); g2.connect(lp);
      lp.connect(masterGain); lp.connect(reverbSend);
      o.start(t0); o.stop(t0 + 1.35);
      o2.start(t0); o2.stop(t0 + 0.75);
    }
    ringTone(now, 0.085, 6000);          // the ping
    ringTone(now + 0.95, 0.028, 2200);   // ...and its distant echo, duller
  }

  function creatureBlip(sizeFactor, big){
    if (!actx || !soundOn) return;
    var now = actx.currentTime;
    var freq = 1350 - sizeFactor * 1080;   // ~1350Hz down to ~270Hz
    var dur = 0.1 + sizeFactor * 0.24;
    var vol = 0.07 + sizeFactor * 0.06;
    // click transient so the blip has a crisp front edge
    var nz = actx.createBufferSource();
    nz.buffer = makeNoiseBuffer(actx, 0.03);
    var hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2000;
    var gn = actx.createGain();
    gn.gain.setValueAtTime(0.035, now);
    gn.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
    nz.connect(hp); hp.connect(gn); gn.connect(masterGain);
    nz.start(now); nz.stop(now + 0.03);
    // body tone with a slight upward chirp
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = big ? 'triangle' : 'sine';
    o.frequency.setValueAtTime(freq*0.92, now);
    o.frequency.exponentialRampToValueAtTime(freq, now + 0.04);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(masterGain); g.connect(reverbSend);
    o.start(now); o.stop(now + dur + 0.05);
    if (big){
      // sub thump under sharks/whales
      var o2 = actx.createOscillator();
      var g2 = actx.createGain();
      o2.type = 'sine';
      o2.frequency.setValueAtTime(freq*0.5, now);
      o2.frequency.exponentialRampToValueAtTime(freq*0.4, now + dur);
      g2.gain.setValueAtTime(0.0001, now);
      g2.gain.exponentialRampToValueAtTime(vol*0.9, now + 0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001, now + dur*1.4);
      o2.connect(g2); g2.connect(masterGain); g2.connect(reverbSend);
      o2.start(now); o2.stop(now + dur*1.4 + 0.05);
    }
  }

  soundBtn.addEventListener('click', function(){
    ensureAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    soundOn = !soundOn;
    soundBtn.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
    if (soundOn) startAmbience(); else stopAmbience();
  });

  // ============================================================
  //  LAKE / BACKDROP
  // ============================================================
  var lakeDepth = 38;
  var lakeTarget = 38;
  function updateLake(dt){
    if (Math.random() < 0.004) lakeTarget = rand(18, 58);
    lakeDepth += (lakeTarget - lakeDepth) * dt * 0.15;
  }
  var bottomWiggleSeed = Math.random()*1000;
  function bottomDepthAt(simTime){
    return lakeDepth + Math.sin(simTime*0.15 + bottomWiggleSeed)*1.6 + Math.sin(simTime*0.53+2)*0.6;
  }

  var scrollSpeed = 46;
  var simTime = 0;
  var colAccum = 0;
  var pingTimer = 0;
  var PING_INTERVAL = 4.2;

  function drawColumn(x, t){
    var bDepth = bottomDepthAt(t);
    var bY = depthToY(bDepth);

    var grad = historyCtx.createLinearGradient(0,0,0,plotH);
    grad.addColorStop(0, colorFor(0.02));
    grad.addColorStop(1, colorFor(0.08));
    historyCtx.fillStyle = grad;
    historyCtx.fillRect(x,0,1,plotH);

    if (Math.random() < 0.5){
      historyCtx.fillStyle = colorFor(rand(0.1,0.3));
      historyCtx.fillRect(x, rand(0,3), 1, 1);
    }

    var thermoY = depthToY(maxDepth()*0.32);
    if (thermoY < bY - 4){
      historyCtx.fillStyle = colorFor(0.18 + Math.random()*0.08);
      historyCtx.fillRect(x, thermoY, 1, 2.2);
    }

    if (Math.random() < 0.4){
      var ny = rand(4, Math.max(5,bY-4));
      historyCtx.fillStyle = colorFor(rand(0.1,0.28));
      historyCtx.fillRect(x, ny, 1, 1);
    }

    if (bY < plotH){
      var shadowH = Math.min(plotH - bY, 20);
      var bgrad = historyCtx.createLinearGradient(0,bY,0,bY+shadowH);
      bgrad.addColorStop(0, colorFor(1.0));
      bgrad.addColorStop(0.25, colorFor(0.55));
      bgrad.addColorStop(1, colorFor(0.15));
      historyCtx.fillStyle = bgrad;
      historyCtx.fillRect(x, bY, 1.3, shadowH);
      historyCtx.fillStyle = colorFor(0.06);
      historyCtx.fillRect(x, bY+shadowH, 1.3, Math.max(0, plotH-(bY+shadowH)));
    }
  }

  function stepBackdrop(dt){
    updateLake(dt);
    pingTimer += dt;
    if (pingTimer >= PING_INTERVAL){
      pingTimer -= PING_INTERVAL;
      sonarPing();
    }
    colAccum += scrollSpeed * dt;
    while (colAccum >= 1){
      colAccum -= 1;
      tempCtx.clearRect(0,0,plotW,plotH);
      tempCtx.drawImage(historyCanvas, 0, 0, plotW, plotH);
      historyCtx.clearRect(0,0,plotW,plotH);
      historyCtx.drawImage(tempCanvas, -1, 0, plotW, plotH);
      simTime += 1/scrollSpeed;
      drawColumn(plotW-1, simTime);
    }
    hudDepth.textContent = Math.round(bottomDepthAt(simTime));
  }

  // ============================================================
  //  CREATURES
  // ============================================================
  var creatureTypes = [
    { type:'baitfish', weight:6, size:[26,40], speed:[16,30], depthFt:[6,25], cluster:true },
    { type:'bluegill', weight:4, size:[30,44], speed:[14,26], depthFt:[4,20] },
    { type:'sunfish', weight:3, size:[28,42], speed:[14,26], depthFt:[4,18] },
    { type:'crappie', weight:3, size:[34,48], speed:[14,24], depthFt:[8,22] },
    { type:'perch', weight:3, size:[38,54], speed:[16,26], depthFt:[8,24] },
    { type:'bass', weight:4, size:[52,74], speed:[16,28], depthFt:[5,20] },
    { type:'trout', weight:3, size:[50,68], speed:[18,30], depthFt:[14,34] },
    { type:'pike', weight:2, size:[72,100], speed:[20,34], depthFt:[8,26] },
    { type:'gar', weight:1.5, size:[70,96], speed:[10,18], depthFt:[3,12] },
    { type:'catfish', weight:2, size:[60,84], speed:[8,16], nearBottom:true },
    { type:'carp', weight:1.5, size:[56,78], speed:[8,15], nearBottom:true },
    { type:'sturgeon', weight:0.8, size:[86,120], speed:[7,13], nearBottom:true },
    { type:'shark', weight:4, size:[100,140], speed:[22,34], depthFt:[10,30] },
    { type:'hammerhead', weight:3, size:[110,160], speed:[18,30], depthFt:[12,32] },
    { type:'greatwhite', weight:5, size:[160,220], speed:[20,32], depthFt:[28,50] },
    { type:'orca', weight:8, size:[200,280], speed:[16,26], depthFt:[8,28] },
    { type:'leopardseal', weight:2.5, size:[140,200], speed:[20,28], depthFt:[6,20] },
    { type:'whale', weight:4, size:[210,280], speed:[8,14], depthFt:[8,26] }
  ];
  var totalWeight = creatureTypes.reduce(function(s,c){return s+c.weight;},0);
  function pickCreatureType(){
    var r = rand(0,totalWeight);
    for (var i=0;i<creatureTypes.length;i++){ r -= creatureTypes[i].weight; if (r<=0) return creatureTypes[i]; }
    return creatureTypes[0];
  }

  var liveFish = [];
  var nextCreatureAt = 1.5;
  var creatureTimer = 0;
  var groupSeq = 0;

  function spawnCreature(){
    var c = pickCreatureType();
    var fromLeft = Math.random() < 0.5;
    var dir = fromLeft ? 1 : -1;
    var count = c.cluster ? Math.round(rand(5,9)) : 1;
    var clusterDepth = c.nearBottom ? null : rand(c.depthFt[0], c.depthFt[1]);
    var gid = ++groupSeq;
    for (var i=0;i<count;i++){
      var size = rand(c.size[0], c.size[1]);
      var depth = c.nearBottom ? null : (c.cluster ? clusterDepth + rand(-2.5,2.5) : rand(c.depthFt[0], c.depthFt[1]));
      var baseSpeed = rand(c.speed[0], c.speed[1]) * dir;
      var fish = {
        type: c.type,
        gid: gid,
        x: fromLeft ? -size - rand(0,60) : plotW + size + rand(0,60),
        depth: depth,
        nearBottom: !!c.nearBottom,
        size: size,
        speed: baseSpeed,
        baseSpeed: baseSpeed,
        bobPhase: rand(0,Math.PI*2),
        bobAmp: c.nearBottom ? 0.4 : rand(0.6,1.6),
        blipped: (c.cluster && i > 0),
        speedPhase: rand(0, Math.PI*2),
        speedFreq: rand(1.2, 2.4),
        speedMin: rand(0.5, 0.75),
        speedMax: rand(1.1, 1.35)
      };
      liveFish.push(fish);
    }
  }

  function countUnits(){
    var seen = {};
    var n = 0;
    for (var i=0;i<liveFish.length;i++){
      if (!seen[liveFish[i].gid]){ seen[liveFish[i].gid] = true; n++; }
    }
    return n;
  }

  function updateCreatures(dt, t){
    creatureTimer += dt;
    if (creatureTimer >= nextCreatureAt){
      creatureTimer = 0;
      nextCreatureAt = rand(1.5, 3.5);
      // keep it uncrowded but lively: up to 5 creatures (a school counts as one)
      if (countUnits() < 5) spawnCreature();
    }
    for (var i=liveFish.length-1;i>=0;i--){
      var f = liveFish[i];
      var speedModulation = (f.speedMax - f.speedMin) / 2;
      var speedMid = (f.speedMax + f.speedMin) / 2;
      f.speed = f.baseSpeed * (speedMid + speedModulation * Math.sin(t * f.speedFreq + f.speedPhase));
      f.x += f.speed * dt;
      var curDepth;
      if (f.nearBottom){
        curDepth = bottomDepthAt(t) - 2.6 + Math.sin(t*1.3+f.bobPhase)*f.bobAmp*0.5;
      } else {
        curDepth = f.depth + Math.sin(t*0.9+f.bobPhase)*f.bobAmp;
      }
      f.curDepth = Math.max(1, curDepth);
      if (f.x < -380 || f.x > plotW+380) liveFish.splice(i,1);
    }
  }

  var lastFlash = 0;
  function drawCreatures(now){
    for (var i=0;i<liveFish.length;i++){
      var f = liveFish[i];
      var y = depthToY(f.curDepth);
      if (y < -60 || y > plotH+60) continue;
      var sprite = spriteImgs[f.type];
      if (!sprite || !sprite.img.complete || sprite.img.naturalWidth === 0) continue;
      var dir = f.speed > 0 ? 1 : -1;
      var drawW = f.size;
      var drawH = f.size * (sprite.vbH / sprite.vbW);
      ctx.save();
      ctx.translate(f.x, y);
      ctx.scale(dir, 1);
      ctx.drawImage(sprite.img, -drawW/2, -drawH/2, drawW, drawH);
      ctx.restore();

      if (!f.blipped && Math.abs(f.x - plotW*0.5) < 40){
        f.blipped = true;
        var big = (f.type === 'shark' || f.type === 'whale' || f.type === 'orca' || f.type === 'greatwhite');
        var sizeFactor = Math.max(0, Math.min(1, (f.size - 26) / (280 - 26)));
        creatureBlip(sizeFactor, big);
        if (big) lastFlash = now;
      }
    }
  }

  function drawScale(){
    ctx.fillStyle = '#0a0f0c';
    ctx.fillRect(plotW, 0, scaleW, H);
    ctx.font = '13px VT323, monospace';
    var md = maxDepth();
    var step = md <= 20 ? 5 : md <= 40 ? 10 : md <= 60 ? 15 : 25;
    for (var d=step; d<md; d+=step){
      var y = depthToY(d);
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(plotW,y);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.stroke();
      ctx.fillStyle = 'rgba(159,225,203,0.85)';
      ctx.fillText(d, plotW+6, y+4);
    }
  }

  var lastT = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now-lastT)/1000);
    lastT = now;

    stepBackdrop(dt);
    updateCreatures(dt, simTime);

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(historyCanvas, 0, 0, plotW, plotH, 0, 0, plotW, plotH);
    drawCreatures(now);
    drawScale();

    var flashAge = now - lastFlash;
    pingDot.style.opacity = flashAge < 260 ? 1 : (0.3 + 0.25*Math.sin(now/500));

    requestAnimationFrame(frame);
  }

  resize();
  buildSprites();
  requestAnimationFrame(frame);

  setInterval(function(){ hudTemp.textContent = Math.round(rand(64,72)); }, 9000);
})();
</script>
